# Mode économie d'énergie du Fishball (lu au démarrage par /usr/sbin/eco)
# Modifiable depuis le PC (racine de la carte SD) ou sur la carte : /boot/eco.conf
# puis « reboot » (ou « eco pause ; eco reprise » pour VEILLE/DELAI/TX_ECO).

# Interface web Tezuka/Maia au démarrage : on | off
# (à la demande : « webui on » / « webui off » en SSH)
WEBUI=off

# Mise en sommeil de l'AD9363 quand aucun logiciel ne l'utilise : on | off
VEILLE=on

# Secondes sans activité avant la mise en sommeil
DELAI=30

# Flux RX orphelin (logiciel tué sans ordre d'arrêt, aucun client iiod) : relance de
# sdr_ip_gadget après ORPH_DELAI secondes (sinon il émettrait indéfiniment et la radio ne
# dormirait plus)
ORPH_DELAI=10

# Oscillateur TX coupé tant que rien n'émet (rallumé au premier échantillon TX) : on | off
TX_ECO=on

# CPU à 333 MHz pendant le sommeil de la radio, 666 MHz dès le réveil ou « eco pause » : on | off
# (nécessite le noyau avec cpufreq ; sans lui, sans effet)
CPU_ECO=on

# DDR3 en power-down automatique pendant le sommeil de la radio : on | off (en test)
DDR_ECO=off

# Ethernet à 100 Mbit/s après ETH_DELAI secondes de sommeil, retour au gigabit à la première
# demande : on | off. Chaque changement coupe le lien ~3,2 s ; la première connexion après
# un passage à 100 Mbit/s prend ~4 s (limite de libiio : 5 s). Désactivé par défaut.
ETH_ECO=off
ETH_DELAI=300
